# Local supporting services for Somaplus development. Laravel Sail is not used:
# run PHP and Node on the host (php artisan serve, npm run dev).
# Credentials below are for local development only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: somaplus
      POSTGRES_USER: somaplus
      POSTGRES_PASSWORD: somaplus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somaplus -d somaplus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres-data:
